channel:
  name: "Let Me Rank That"
  handle: "@letmerankthat"

video:
  width: 1080
  height: 1920
  fps: 30
  items: 5            # countdown length (#5 -> #1)

script:
  model: "claude-sonnet-5"
  max_tokens: 4000
  attempts: 4

voice:
  # Whole narration is ONE take (natural flow) with word timestamps.
  # voice_name / voice_id are filled from `voices` below for each video.
  model: "eleven_multilingual_v2"
  voice_name: "Brian"
  voice_id: "nPczCjzI2devNBz1zQrb"
  stability: 0.45
  similarity_boost: 0.8
  style: 0.25
  speed: 1.1

pillars:
  money:   {accent: "#2BD67B", label: "MONEY"}
  animals: {accent: "#FF9F1C", label: "ANIMALS"}
  records: {accent: "#9B6BFF", label: "RECORDS"}

# Voices are A/B tested: the weekly manager shifts weight to the one with
# better views/retention. The first voice is the safe fallback.
voices:
  - {name: "Brian", voice_id: "nPczCjzI2devNBz1zQrb"}
  - {name: "Adam",  voice_id: "pNInz6obpgDQGcFmaJgB"}

selection:
  topic_cooldown: 5          # a topic can't repeat within the last 5 uploads
  pillar_base: {money: 1.0, animals: 1.0, records: 1.0}

manager:
  min_videos: 2              # a group needs this many videos to be re-weighted
  min_age_days: 2            # ignore videos younger than this
  weight_min: 0.4
  weight_max: 2.5
  smoothing: 0.5             # new = old * s + target * (1 - s)

# Numbered series per pillar (title suffix "| Money Ranked #12")
series:
  money: "Money Ranked"
  animals: "Animal Ranked"
  records: "Record Ranked"

# One public playlist per pillar, created automatically on first use
playlists:
  money:   {title: "Money Rankings", description: "Top 5 countdowns on prices, costs and money around the world. Real data, source on screen."}
  animals: {title: "Animal Rankings", description: "Top 5 countdowns on the fastest, oldest and most extreme animals. Real data, source on screen."}
  records: {title: "Record Rankings", description: "Top 5 countdowns on the tallest, deepest and biggest things on Earth. Real data, source on screen."}
