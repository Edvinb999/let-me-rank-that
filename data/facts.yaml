# Curated, source-checked rankings for the ANIMALS and RECORDS pillars.
# Rules: every value has a source; `disputed: true` marks estimates the
# narration must present as estimates. Order does not matter (code sorts).
# Checked 2026-09-25. Re-check buildings yearly (new towers complete).

