  - id: longest-living-animals
    pillar: animals
    title: "Longest-living animals"
    subtitle: "Oldest known individual"
    unit_hint: "age of the oldest known individual in years"
    unit: "years"
    decimals: 0
    source: "Sources: Science (2016), NPR, Ocean Conservancy"
    source_long: "Data: Nielsen et al. 2016, Science (Greenland shark, radiocarbon estimate ±120 years); Ming the ocean quahog (507 years, shell growth lines); bowhead whale 211 years (eye-lens dating); rougheye rockfish 205 years (WDFW); Jonathan the tortoise (estimated)."
    items:
      - {name: "Ocean quahog clam", aliases: ["Ming", "quahog", "clam"], value: 507, note: "a clam nicknamed Ming, age counted from growth lines in its shell"}
      - {name: "Greenland shark", aliases: ["shark"], value: 392, display: "~392 years", disputed: true, note: "radiocarbon estimate with a margin of 120 years either way"}
      - {name: "Bowhead whale", aliases: ["bowhead", "whale"], value: 211, note: "longest-living mammal"}
      - {name: "Rougheye rockfish", aliases: ["rockfish"], value: 205, note: "a deep-water Pacific fish"}
      - {name: "Giant tortoise", aliases: ["Jonathan", "tortoise"], value: 190, display: "~190 years", disputed: true, note: "Jonathan, a tortoise on St Helena; birth year is estimated"}
