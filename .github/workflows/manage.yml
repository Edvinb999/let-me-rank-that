name: Weekly manager

on:
  schedule:
    - cron: "30 7 * * 1"   # Mondays 07:30 UTC, before the 08:00 review
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  manage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Analyse and re-weight
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m src.manager
      - name: Save weights and report
        run: |
          git config user.name "lmrt-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/ reports/
          git commit -m "Weekly manager" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
